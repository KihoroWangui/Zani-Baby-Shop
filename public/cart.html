<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - Zani Baby Shop</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    .cart-section {
      box-sizing: border-box;
      width: min(100% - 32px, 1100px);
      margin: 48px auto;
      padding: clamp(24px, 5vw, 48px);
      background: #fff;
      border: 1px solid #e8eaf0;
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(30, 41, 59, 0.08);
    }

    .cart-section h1 {
      margin: 0;
      color: #202b3c;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      letter-spacing: -0.04em;
    }

    #cart-container {
      margin-top: 24px;
      overflow-x: auto;
      border: 1px solid #e6e9ef;
      border-radius: 14px;
      background-color: #fff;
    }

    #cart-container:has(p) {
      padding: 28px;
      color: #697586;
      text-align: center;
    }

    #cart-container p {
      margin: 0;
    }

    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      background-color: #fff;
    }

    th,
    td {
      padding: 16px 18px;
      border-bottom: 1px solid #edf0f4;
      text-align: center;
    }

    th {
      background-color: #f7f8fb;
      color: #596579;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    td {
      color: #344054;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr:hover {
      background-color: #fbfcfe;
    }

    input[type="number"] {
      box-sizing: border-box;
      width: 72px;
      padding: 9px 10px;
      border: 1px solid #d6dbe4;
      border-radius: 8px;
      color: #263445;
      font: inherit;
      text-align: center;
    }

    input[type="number"]:focus {
      border-color: #5377d4;
      outline: 3px solid rgba(83, 119, 212, 0.15);
    }

    .remove-btn {
      padding: 8px 12px;
      border: 1px solid #f1c8cc;
      border-radius: 8px;
      background: #fff7f7;
      color: #b42332;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .remove-btn:hover {
      border-color: #e7a9af;
      background: #ffeded;
    }

    #total-amount {
      margin: 24px 0 0;
      color: #202b3c;
      font-size: 1.35rem;
      font-weight: 700;
      text-align: right;
    }

    #checkout-btn {
      display: block;
      margin: 18px 0 0 auto;
      padding: 13px 22px;
      border: 0;
      border-radius: 10px;
      background: #3158b8;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(49, 88, 184, 0.22);
      transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    #checkout-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #24489f;
      box-shadow: 0 8px 18px rgba(49, 88, 184, 0.28);
    }

    #checkout-btn:focus-visible,
    .remove-btn:focus-visible {
      outline: 3px solid rgba(49, 88, 184, 0.3);
      outline-offset: 3px;
    }

    #checkout-btn:disabled {
      background: #aeb8cc;
      box-shadow: none;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .cart-section {
        width: min(100% - 20px, 1100px);
        margin: 24px auto;
        padding: 22px 16px;
        border-radius: 14px;
      }

      #total-amount {
        text-align: left;
      }

      #checkout-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="navbar-logo">
      <img src="images/logo.png" alt="Logo" />
    </a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="auth.html" class="nav-icon" aria-label="Account" title="Account"><i class="bi bi-person"></i></a></li>
      <li><a href="cart.html" class="nav-icon" aria-label="Cart" title="Cart"><i class="bi bi-cart"></i></a></li>
    </ul>
  </nav>

  <main>
    <section class="cart-section">
      <h1>Your Cart</h1>
      <div id="cart-container"></div>
      <h3 id="total-amount"></h3>
      <button id="checkout-btn">Proceed to Payment</button>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; 2026 Zani Baby Shop. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const API_URL = "https://clocks-park-values-southern.trycloudflare.com";

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    const container = document.getElementById('cart-container');
    const totalDisplay = document.getElementById('total-amount');
    const checkoutBtn = document.getElementById('checkout-btn');

    function renderCart() {
      if(cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty.</p>';
        totalDisplay.textContent = '';
        checkoutBtn.disabled = true;
        return;
      }

      let table = '<table><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th>Remove</th></tr>';
      cart.forEach((item, index) => {
        if(!item.quantity) item.quantity = 1;
        const subtotal = item.price * item.quantity;
        table += `
          <tr>
            <td>${item.name}</td>
            <td>KSh ${item.price}</td>
            <td><input type="number" min="1" value="${item.quantity}" data-index="${index}"></td>
            <td>KSh ${subtotal}</td>
            <td><button data-index="${index}" class="remove-btn">Remove</button></td>
          </tr>
        `;
      });
      table += '</table>';
      container.innerHTML = table;

      updateTotal();
      attachEvents();
    }

    function updateTotal() {
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      totalDisplay.textContent = `Total: KSh ${total}`;
    }

    function attachEvents() {
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.dataset.index);
          cart.splice(index, 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          renderCart();
        });
      });

      document.querySelectorAll('input[type="number"]').forEach(input => {
        input.addEventListener('change', () => {
          const index = parseInt(input.dataset.index);
          const value = parseInt(input.value);
          if(value < 1) input.value = 1;
          cart[index].quantity = value;
          localStorage.setItem('cart', JSON.stringify(cart));
          renderCart();
        });
      });
    }

    checkoutBtn.addEventListener('click', async () => {
      if(cart.length === 0) return alert("Your cart is empty!");

      const totalAmount = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      const phone = prompt("Enter your phone number (e.g., 2547XXXXXXXX):");
      if (!phone) return alert("Payment cancelled. Phone number is required.");

      try {
        const response = await fetch(`${API_URL}/stkpush`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone, amount: totalAmount }),
        });

        const data = await response.json();
        console.log("STK Push response:", data);

        if (data.ResponseCode === "0") {
          alert(`STK Push sent to ${phone}! Please check your phone to complete payment.`);
          cart = [];
          localStorage.removeItem('cart');
          renderCart();
        } else {
          alert("Payment initiation failed. Please try again.");
        }
      } catch (error) {
        console.error(error);
        alert("Error initiating payment. Check console for details.");
      }
    });

    renderCart();
  </script>
</body>
</html>
