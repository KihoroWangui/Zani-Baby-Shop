<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Blue baby shower nursery</title>
  <desc id="desc">A calm blue nursery illustration with a crib, moon, clouds, stars, balloons, and baby shower bunting.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff2ff"/>
      <stop offset="1" stop-color="#a9d8f4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6e4f6"/>
      <stop offset="1" stop-color="#8ebfe0"/>
    </linearGradient>
    <linearGradient id="crib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#d5e9f5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#467da2" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <circle cx="1320" cy="180" r="78" fill="#fff7d6" opacity=".8"/>
  <path d="M0 790 Q400 740 800 790 T1600 770 V1000 H0Z" fill="url(#floor)"/>
  <path d="M0 0H1600V45H0Z" fill="#fff" opacity=".22"/>
  <!-- soft clouds and stars -->
  <g fill="#fff" opacity=".78">
    <path d="M220 245c0-25 20-45 45-45 15-35 65-42 90-12 37-6 63 23 58 57H220Z"/>
    <path d="M1050 325c0-22 18-40 40-40 14-31 57-37 79-10 33-5 56 21 51 50h-170Z"/>
  </g>
  <g fill="#fff4c2" opacity=".95">
    <path d="m475 160 9 19 21 3-15 15 4 21-19-10-19 10 4-21-15-15 21-3Z"/>
    <path d="m920 180 7 15 17 2-12 12 3 17-15-8-15 8 3-17-12-12 17-2Z"/>
    <path d="m1190 440 6 13 14 2-10 10 2 14-12-7-13 7 3-14-10-10 14-2Z"/>
    <circle cx="360" cy="365" r="6"/><circle cx="850" cy="285" r="5"/><circle cx="1400" cy="365" r="6"/>
  </g>
  <!-- baby shower bunting -->
  <path d="M190 90 Q800 410 1410 90" fill="none" stroke="#78afd2" stroke-width="5" opacity=".8"/>
  <g stroke="#fff" stroke-width="3">
    <path d="m300 144 69 37-57 48Z" fill="#f8d8e2"/>
    <path d="m420 208 69 34-56 52Z" fill="#fff0c4"/>
    <path d="m550 262 73 28-50 58Z" fill="#c7e8f8"/>
    <path d="m688 302 76 18-39 64Z" fill="#f5dbe8"/>
    <path d="m840 318 76 0-30 70Z" fill="#fff0c4"/>
    <path d="m990 296 73-20-20 73Z" fill="#c7e8f8"/>
    <path d="m1130 250 69-34-10 76Z" fill="#f8d8e2"/>
    <path d="m1260 184 65-41 0 76Z" fill="#fff0c4"/>
  </g>
  <!-- balloons -->
  <g stroke="#6b9fc2" stroke-width="3" fill="none" opacity=".9">
    <path d="M180 575 Q165 650 210 760"/><path d="M250 555 Q260 655 240 760"/><path d="M320 590 Q285 680 270 760"/>
  </g>
  <g filter="url(#soft-shadow)">
    <ellipse cx="180" cy="540" rx="54" ry="70" fill="#f7dce8"/><ellipse cx="250" cy="520" rx="57" ry="74" fill="#fff0c4"/><ellipse cx="320" cy="555" rx="53" ry="68" fill="#acd9f2"/>
  </g>
  <g fill="#fff" opacity=".65"><ellipse cx="162" cy="515" rx="13" ry="22"/><ellipse cx="231" cy="491" rx="14" ry="24"/><ellipse cx="302" cy="530" rx="12" ry="20"/></g>
  <!-- rug -->
  <ellipse cx="835" cy="830" rx="430" ry="83" fill="#f4fbff" opacity=".75"/>
  <!-- crib -->
  <g filter="url(#soft-shadow)">
    <rect x="505" y="535" width="610" height="300" rx="25" fill="url(#crib)" stroke="#8eb8d2" stroke-width="10"/>
    <rect x="535" y="570" width="550" height="230" rx="18" fill="#fafdff"/>
    <path d="M505 590h610M505 800h610" stroke="#86b4d2" stroke-width="14" stroke-linecap="round"/>
    <g stroke="#9cc3dc" stroke-width="11" stroke-linecap="round">
      <path d="M570 590v210M635 590v210M700 590v210M765 590v210M830 590v210M895 590v210M960 590v210M1025 590v210"/>
    </g>
    <path d="M560 838v48M1060 838v48" stroke="#7ba9c8" stroke-width="20" stroke-linecap="round"/>
    <path d="M555 535q260-60 510 0" fill="none" stroke="#f7dce8" stroke-width="16" stroke-linecap="round"/>
    <circle cx="810" cy="470" r="65" fill="#ffe6a8"/>
    <path d="M785 470q25-30 50 0" fill="none" stroke="#d7a975" stroke-width="6" stroke-linecap="round"/>
    <circle cx="790" cy="450" r="5" fill="#9c7658"/><circle cx="830" cy="450" r="5" fill="#9c7658"/>
  </g>
  <!-- side table and lamp -->
  <g filter="url(#soft-shadow)">
    <rect x="1190" y="690" width="180" height="30" rx="12" fill="#fff"/>
    <path d="M1215 720v112M1345 720v112" stroke="#86b4d2" stroke-width="16" stroke-linecap="round"/>
    <path d="M1245 690 1260 610h70l18 80Z" fill="#fff0c4" stroke="#fff" stroke-width="8"/>
    <path d="M1295 610v-34" stroke="#86b4d2" stroke-width="9"/>
    <circle cx="1295" cy="565" r="12" fill="#ffe6a8"/>
  </g>
  <!-- gentle blue vignette -->
  <rect width="1600" height="1000" fill="#3e83b3" opacity=".07"/>
</svg>
